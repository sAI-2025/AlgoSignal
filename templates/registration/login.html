{% extends 'base.html' %}
{% block title %}Login | AlgoSignal{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body">
        <h2 class="h4 mb-3">Sign in</h2>
        {% if form.errors %}
        <div class="alert alert-danger">Invalid username or password.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <input
              class="form-control"
              id="id_username"
              name="username"
              required
            />
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password">Password</label>
            <input
              class="form-control"
              id="id_password"
              name="password"
              type="password"
              required
            />
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
